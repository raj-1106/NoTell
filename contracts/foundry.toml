[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
ffi = true

remappings = [
    "@chainlink/=lib/chainlink-brownie-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[etherscan]
monad_testnet = { key = "${MONAD_ETHERSCAN_KEY}", url = "${MONAD_EXPLORER_URL}" }
